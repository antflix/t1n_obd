name: Build ESP32 firmware

on:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - '.github/workflows/build-firmware.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firmware-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 Arduino core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli core list
      - name: Inject Wi-Fi credential into build
        env:
          ANTNET_WIFI_PASSWORD: ${{ secrets.ANTNET_WIFI_PASSWORD }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys
          password = os.environ.get("ANTNET_WIFI_PASSWORD", "")
          if not password:
              sys.exit("ANTNET_WIFI_PASSWORD GitHub Actions secret is not configured")
          pathlib.Path("firmware/t1n_obd/wifi_build_config.h").write_text(
              "#pragma once\n#define T1N_BUILD_WIFI_PASSWORD " + json.dumps(password) + "\n"
          )
          PY
      - name: Compile ESP32 Dev Module with OTA partition
        run: |
          mkdir -p build dist
          arduino-cli compile \
            --fqbn esp32:esp32:esp32:PartitionScheme=min_spiffs \
            --output-dir build \
            firmware/t1n_obd
      - name: Prepare OTA files
        shell: bash
        run: |
          set -euo pipefail
          APP_BIN="$(find build -maxdepth 1 -type f -name '*.bin' \
            ! -name '*.bootloader.bin' ! -name '*.partitions.bin' ! -name '*.merged.bin' \
            -printf '%s %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          test -n "$APP_BIN"
          cp "$APP_BIN" dist/firmware.bin
          sha256sum dist/firmware.bin | awk '{print $1}' > dist/firmware.sha256
          python3 - <<'PY'
          import datetime, json, os, pathlib, re
          sha=pathlib.Path('dist/firmware.sha256').read_text().strip()
          repo=os.environ['GITHUB_REPOSITORY']; commit=os.environ['GITHUB_SHA']
          source=pathlib.Path('firmware/t1n_obd/t1n_obd.ino').read_text()
          m=re.search(r'FIRMWARE_VERSION\s*=\s*"([^"]+)"',source)
          version=m.group(1) if m else commit[:7]
          manifest={'version':version,'commit':commit,'built_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'firmware_url':f'https://github.com/{repo}/releases/download/latest/firmware.bin','sha256_url':f'https://github.com/{repo}/releases/download/latest/firmware.sha256','sha256':sha,'board':'ESP32 Dev Module','fqbn':'esp32:esp32:esp32:PartitionScheme=min_spiffs'}
          pathlib.Path('dist/manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
      - name: Publish moving latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            dist/firmware.bin dist/firmware.sha256 dist/manifest.json \
            --target "$GITHUB_SHA" \
            --title "Latest T1N OBD Firmware" \
            --notes "Automatically built from main at commit $GITHUB_SHA. The latest tag intentionally moves so the ESP32 always has one stable OTA URL."
          gh release edit latest --draft=false --prerelease=false

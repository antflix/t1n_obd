name: Build ESP32 firmware

on:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - '.github/workflows/build-firmware.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firmware-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 Arduino core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli core list
      - name: Inject Wi-Fi credential into build
        env:
          ANTNET_WIFI_PASSWORD: ${{ secrets.ANTNET_WIFI_PASSWORD }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys
          password = os.environ.get("ANTNET_WIFI_PASSWORD", "")
          if not password:
              sys.exit("ANTNET_WIFI_PASSWORD GitHub Actions secret is not configured")
          pathlib.Path("firmware/t1n_obd/wifi_build_config.h").write_text(
              "#pragma once\n#define T1N_BUILD_WIFI_PASSWORD " + json.dumps(password) + "\n"
          )
          PY
      - name: Install deterministic asset compressors
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund terser@5.39.0 clean-css-cli@5.6.3
          python3 -m pip install --quiet zopfli==0.4.2
      - name: Compress dashboard for limited OTA partitions
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess, zopfli.gzip
          def compress_html(html):
              match=re.search(r'(<script>)(.*?)(</script>)',html,re.S)
              if not match:
                  raise SystemExit('Missing dashboard script element')
              js=subprocess.run(['./node_modules/.bin/terser','--compress','--mangle'],
                                input=match.group(2),text=True,capture_output=True,check=True).stdout.strip()
              html=html[:match.start(2)]+js+html[match.end(2):]
              css_match=re.search(r'(<style>)(.*?)(</style>)',html,re.S)
              if css_match:
                  css=subprocess.run(['./node_modules/.bin/cleancss','--level','2'],
                                     input=css_match.group(2),text=True,capture_output=True,check=True).stdout.strip()
                  html=html[:css_match.start(2)]+css+html[css_match.end(2):]
              html=re.sub(r'>\s+<','><',html)
              raw=html.encode('utf-8')
              return raw,zopfli.gzip.compress(raw,numiterations=15)
          path=pathlib.Path("firmware/t1n_obd/50_scanner_ui.ino")
          src=path.read_text()
          found=re.search(r'String scannerPage\(\)\{return R"HTML\((.*?)\)HTML";\}', src, re.S)
          if not found:
              raise SystemExit("Cannot locate dashboard HTML")
          raw,compressed=compress_html(found.group(1))
          if len(compressed)>=len(raw):
              raise SystemExit("Dashboard compression not effective")
          lines=["#pragma once","#include <Arduino.h>","static const uint8_t SCANNER_UI_GZIP[] PROGMEM = {"]
          for i in range(0,len(compressed),16):
              lines.append("  "+", ".join("0x%02x"%v for v in compressed[i:i+16])+",")
          lines.extend(["};","static const size_t SCANNER_UI_GZIP_LEN = sizeof(SCANNER_UI_GZIP);"])
          pathlib.Path("firmware/t1n_obd/scanner_ui_gzip_generated.h").write_text("\n".join(lines)+"\n")
          print("Scanner UI compressed:",len(raw),"->",len(compressed),"bytes; saved",len(raw)-len(compressed))
          advanced=pathlib.Path("firmware/t1n_obd/40_advanced_ui.ino").read_text()
          found=re.search(r'String advancedPage\(\)\{return R"HTML\((.*?)\)HTML";\}',advanced,re.S)
          if not found:
              raise SystemExit("Cannot locate advanced workbench HTML")
          raw,compressed=compress_html(found.group(1))
          lines=["#pragma once","#include <Arduino.h>","static const uint8_t ADVANCED_UI_GZIP[] PROGMEM = {"]
          for i in range(0,len(compressed),16):
              lines.append("  "+", ".join("0x%02x"%v for v in compressed[i:i+16])+",")
          lines.extend(["};","static const size_t ADVANCED_UI_GZIP_LEN = sizeof(ADVANCED_UI_GZIP);"])
          pathlib.Path("firmware/t1n_obd/advanced_ui_gzip_generated.h").write_text("\n".join(lines)+"\n")
          print("Advanced UI compressed:",len(raw),"->",len(compressed),"bytes; saved",len(raw)-len(compressed))
          PY
      - name: Compile ESP32 Dev Module with OTA partition
        run: |
          mkdir -p build dist
          arduino-cli compile \
            --fqbn esp32:esp32:esp32:PartitionScheme=min_spiffs \
            --build-property compiler.cpp.extra_flags=-DT1N_USE_GZIP_PAGE \
            --output-dir build \
            firmware/t1n_obd
      - name: Prepare OTA files
        shell: bash
        run: |
          set -euo pipefail
          APP_BIN="$(find build -maxdepth 1 -type f -name '*.bin' \
            ! -name '*.bootloader.bin' ! -name '*.partitions.bin' ! -name '*.merged.bin' \
            -printf '%s %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          test -n "$APP_BIN"
          cp "$APP_BIN" dist/firmware.bin
          test "$(stat -c %s dist/firmware.bin)" -le 1450000 || { echo "OTA image exceeds conservative 1,450,000-byte cap (min_spiffs app partition is 1,966,080 bytes)"; exit 1; }
          # Full flash image for USB installers such as ESPHome Web.
          FULL_BIN="$(find build -maxdepth 1 -type f -name '*.merged.bin' -print -quit)"
          test -n "$FULL_BIN" || { echo "Missing merged flash image"; exit 1; }
          cp "$FULL_BIN" dist/firmware-full.bin
          sha256sum dist/firmware.bin | awk '{print $1}' > dist/firmware.sha256
          python3 - <<'PY'
          import datetime, json, os, pathlib, re, shutil
          sha=pathlib.Path('dist/firmware.sha256').read_text().strip()
          repo=os.environ['GITHUB_REPOSITORY']; commit=os.environ['GITHUB_SHA']
          source=pathlib.Path('firmware/t1n_obd/t1n_obd.ino').read_text()
          m=re.search(r'FIRMWARE_VERSION\s*=\s*"([^"]+)"',source)
          version=m.group(1) if m else commit[:7]
          # Immutable filename per version avoids accidentally selecting a prior download.
          shutil.copyfile('dist/firmware.bin',f'dist/t1n-{version}.bin')
          manifest={'version':version,'commit':commit,'built_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'firmware_url':f'https://github.com/{repo}/releases/download/latest/t1n-{version}.bin','sha256_url':f'https://github.com/{repo}/releases/download/latest/firmware.sha256','sha256':sha,'board':'ESP32 Dev Module','fqbn':'esp32:esp32:esp32:PartitionScheme=min_spiffs'}
          pathlib.Path('dist/manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
      - name: Publish moving latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            dist/firmware.bin dist/t1n-*.bin dist/firmware-full.bin dist/firmware.sha256 dist/manifest.json \
            --target "$GITHUB_SHA" \
            --title "Latest T1N OBD Firmware" \
            --notes "Automatically built from main at commit $GITHUB_SHA. The latest tag intentionally moves so the ESP32 always has one stable OTA URL."
          gh release edit latest --draft=false --prerelease=false
